{% extends 'catalog/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
<h1>Удалить товар "{{ object.name }}"?</h1>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
