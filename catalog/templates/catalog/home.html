{% for product in products %}
<div class="col-md-4 mb-4">
    <div class="card h-100 shadow-sm">
        ...
        <div class="card-body d-flex flex-column">
            ...
            <a href="{% url 'catalog:product_detail' product.pk %}" class="btn btn-primary mt-2">Подробнее</a>
            {% if user.is_authenticated %}
                {% if user == product.owner or user.has_perm 'catalog.can_unpublish_product' or user.has_perm 'catalog.delete_product' %}
                    <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-sm btn-secondary mt-1">Редактировать</a>
                    <a href="{% url 'catalog:product_delete' product.pk %}" class="btn btn-sm btn-danger mt-1">Удалить</a>
                {% endif %}
            {% endif %}
        </div>
    </div>
</div>
{% endfor %}
