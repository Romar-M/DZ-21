{% extends 'catalog/base.html' %}

{% block title %}
    {% if object %}Редактирование товара{% else %}Новый товар{% endif %}
{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать{% else %}Добавить{% endif %} товар</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
