
{% extends 'catalog/base.html' %}

{% block title %}
    {% if object %}Редактирование статьи{% else %}Новая статья{% endif %}
{% endblock %}

{% block content %}
<h1>{% if object %}Редактировать{% else %}Создать{% endif %} статью</h1>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{% url 'blog:list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
